<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>點餐</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <section id="connectionBanner" class="banner hidden">
      連線中斷，正在嘗試重新連線……
    </section>

    <section id="orderPage" class="card">
      <h1>點餐</h1>
      <p class="muted">一張訂單只能選擇一個品項。</p>
      <div id="menu" class="menu-grid"></div>
    </section>

    <section id="ticketPage" class="card center hidden">
      <p class="muted">你的號碼</p>
      <div id="number" class="number">--</div>
      <h2 id="item"></h2>
      <p id="status" class="status">請留意叫號</p>
      <button id="newOrderBtn" class="secondary hidden">重新點餐</button>
    </section>
  </main>

  <audio id="ding" preload="auto">
    <source src="/ding.wav" type="audio/wav" />
  </audio>

  <script src="/client.js"></script>
</body>
</html>
